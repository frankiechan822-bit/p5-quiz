<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小五呈分試模擬練習平台 (P5 Pre-S1 Assessment)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      background-color: #0b0d11;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <main class="w-full max-w-4xl mx-auto px-4 py-6 sm:py-8 flex-1 flex flex-col justify-center">

    <!-- Main Exam Container -->
    <div id="exam-card" class="bg-[#13151b] border border-[#222631] rounded-3xl p-5 sm:p-7 shadow-2xl relative">

      <!-- Daily Rotation Banner & Subject Tabs -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 bg-[#181b23] border border-[#252a37] px-4 py-2.5 rounded-2xl">
        <div class="flex items-center gap-2 text-xs text-slate-300">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="daily-rotation-info">系統已按今日日期自動載入輪替科目</span>
        </div>
        <span id="hk-date-badge" class="text-xs font-mono text-slate-400"></span>
      </div>

      <div class="grid grid-cols-3 gap-2 mb-6 p-1.5 bg-[#191c24] border border-[#252a36] rounded-2xl text-center">
        <button id="tab-chinese" onclick="switchSubject('chinese')" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-pen-nib"></i> 中文科 (Chinese)
        </button>
        <button id="tab-english" onclick="switchSubject('english')" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-book"></i> 英文科 (English)
        </button>
        <button id="tab-maths" onclick="switchSubject('maths')" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-calculator"></i> 數學科 (Maths)
        </button>
      </div>

      <!-- Header Section: Title & 20-Minute Countdown Clock -->
      <div class="flex items-center justify-between gap-3 mb-5 flex-wrap border-b border-[#222631] pb-4">
        <div>
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-[#1d222d] text-blue-400 border border-[#2b3344]">
            <i class="fa-solid fa-graduation-cap text-xs"></i> 香港小五呈分試高頻失分專項
          </span>
          <h1 id="exam-heading" class="text-xl sm:text-2xl font-extrabold text-white mt-2 tracking-tight">
            小五中文科呈分模擬卷 (20題單選)
          </h1>
        </div>

        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2 bg-[#1a1e27] border border-[#2a3242] px-4 py-2 rounded-2xl">
            <i class="fa-regular fa-clock text-blue-400 text-sm"></i>
            <span id="timer-text" class="font-mono text-lg font-bold tracking-wider text-white">20:00</span>
          </div>
          <button id="pause-btn" onclick="togglePause()" class="px-4 py-2 rounded-2xl text-xs font-semibold bg-[#1f2430] hover:bg-[#293040] text-slate-300 border border-[#2e3647] transition">
            <span id="pause-text">暫停</span>
          </button>
        </div>
      </div>

      <!-- Question Palette (1–20) -->
      <div class="bg-[#171a21] border border-[#242935] rounded-2xl p-4 sm:p-5 mb-6">
        <div class="flex items-center justify-between text-xs font-semibold mb-3">
          <span class="text-slate-400 uppercase tracking-wider">答題卡 (QUESTION PALETTE 1–20)</span>
          <div class="flex items-center gap-3">
            <span class="hidden sm:inline-flex items-center gap-1 text-[11px] text-slate-400"><span class="w-2.5 h-2.5 rounded-sm bg-blue-600/40 border border-blue-500 inline-block"></span> 已答</span>
            <span class="hidden sm:inline-flex items-center gap-1 text-[11px] text-slate-400"><span class="w-2.5 h-2.5 rounded-sm bg-amber-500/30 border border-amber-500 inline-block"></span> 待覆核</span>
            <span id="palette-count" class="text-blue-400 font-mono">0 / 20 已答</span>
          </div>
        </div>
        <div id="palette-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2"></div>
      </div>

      <!-- Question Area -->
      <div id="question-area" class="relative">
        <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="item-number-tag" class="text-base sm:text-lg font-bold text-white">第 1 題 / 共 20 題</span>
            <span id="category-tag" class="text-xs font-mono px-2.5 py-0.5 rounded-md bg-[#1c212b] text-indigo-300 border border-[#2b3344]">
              考點標籤
            </span>
          </div>
          <button id="flag-btn" onclick="toggleFlag()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#191d26] hover:bg-[#222835] text-slate-300 border border-[#2a3140] transition">
            <i class="fa-regular fa-flag text-xs"></i>
            <span id="flag-text">標記覆核</span>
          </button>
        </div>

        <!-- Question Text -->
        <div class="bg-[#171920] border border-[#242834] p-4 sm:p-5 rounded-2xl mb-5">
          <p id="question-prompt" class="text-sm sm:text-base leading-relaxed text-slate-200 font-medium whitespace-pre-line"></p>
        </div>

        <!-- Multiple Choice Options -->
        <div id="options-container" class="space-y-3"></div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" class="hidden absolute inset-0 bg-[#0b0d11]/95 backdrop-blur-md rounded-2xl z-20 flex flex-col items-center justify-center text-center p-6">
          <div class="w-14 h-14 rounded-2xl bg-[#1b202b] border border-[#2c3547] flex items-center justify-center text-2xl text-blue-400 mb-4">
            <i class="fa-solid fa-pause"></i>
          </div>
          <h3 class="text-xl font-bold text-white mb-2">測驗計時已暫停</h3>
          <p class="text-slate-400 text-xs sm:text-sm max-w-sm mb-5">倒數計時器已凍結。點擊下方按鈕恢復作答。</p>
          <button onclick="togglePause()" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition shadow-lg">
            繼續作答 (Resume)
          </button>
        </div>
      </div>

      <!-- Bottom Navigation & Submit -->
      <div class="flex items-center justify-between gap-3 mt-8 pt-5 border-t border-[#222631]">
        <button id="prev-btn" onclick="navigate(-1)" class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-[#1b1f28] hover:bg-[#242a37] text-slate-300 border border-[#2b3342] transition disabled:opacity-30">
          上一題
        </button>
        <button id="next-btn" onclick="navigate(1)" class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-[#1b1f28] hover:bg-[#242a37] text-slate-300 border border-[#2b3342] transition">
          下一題
        </button>
        <button onclick="confirmSubmit()" class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white transition shadow-lg">
          交卷批改 (Submit)
        </button>
      </div>

    </div>

    <!-- Results & Detailed Analysis View -->
    <div id="result-view" class="hidden flex-col gap-6">

      <!-- Summary Score Card -->
      <div class="bg-[#13151b] border border-[#222631] rounded-3xl p-6 sm:p-8 text-center shadow-2xl">
        <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 bg-blue-600/20 text-blue-400 border border-blue-500/30">
          <i class="fa-solid fa-award"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">呈分試模擬評估報告</h2>
        <p id="res-subject-label" class="text-slate-400 text-xs sm:text-sm mb-6">小五中文科 成績統計</p>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto mb-6 text-left">
          <div class="bg-[#181b22] border border-[#252a36] p-4 rounded-2xl">
            <span class="text-[11px] font-bold uppercase text-slate-400">總得分 (Score)</span>
            <div id="res-score" class="text-2xl font-black text-white mt-1">-- / 20</div>
          </div>
          <div class="bg-[#181b22] border border-[#252a36] p-4 rounded-2xl">
            <span class="text-[11px] font-bold uppercase text-slate-400">正確率 (Accuracy)</span>
            <div id="res-accuracy" class="text-2xl font-black text-emerald-400 mt-1">--%</div>
          </div>
          <div class="bg-[#181b22] border border-[#252a36] p-4 rounded-2xl">
            <span class="text-[11px] font-bold uppercase text-slate-400">作答用時 (Time)</span>
            <div id="res-time" class="text-2xl font-black text-blue-400 mt-1">--:--</div>
          </div>
          <div class="bg-[#181b22] border border-[#252a36] p-4 rounded-2xl">
            <span class="text-[11px] font-bold uppercase text-slate-400">呈分表現評估</span>
            <div id="res-band" class="text-2xl font-black text-amber-400 mt-1">Band 1</div>
          </div>
        </div>

        <div class="flex items-center justify-center gap-3 flex-wrap">
          <button onclick="resetCurrentExam()" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition shadow-lg">
            <i class="fa-solid fa-rotate-right mr-1.5"></i> 重新練習本科
          </button>
          <button onclick="switchToNextSubject()" class="px-6 py-2.5 rounded-xl bg-[#1f2430] hover:bg-[#2a3140] text-slate-200 font-semibold text-sm transition border border-[#2e3647]">
            <i class="fa-solid fa-forward mr-1.5"></i> 切換下一科練習
          </button>
        </div>
      </div>

      <!-- Detailed Explanations -->
      <div class="bg-[#13151b] border border-[#222631] rounded-3xl p-6 sm:p-8 shadow-2xl">
        <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass-chart text-blue-400"></i> 逐題批改與呈分試失分陷阱解析
          </h3>
          <button id="filter-wrong-btn" onclick="toggleWrongOnly()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-[#1a1e27] hover:bg-[#242a37] text-slate-300 border border-[#2c3444] transition">
            只看錯題 (Show Mistakes Only)
          </button>
        </div>
        <div id="review-cards-list" class="space-y-4"></div>
      </div>

    </div>

  </main>

  <script>
    // 香港小五呈分試高頻失分題庫（中、英、數各 20 題）
    const examDatabase = {
      chinese: [
        {
          id: 1,
          category: "成語錯別字辨識",
          question: "下列句子中，哪一個成語的用字完全正確？",
          options: [
            "他沒有真才實學，在樂團裡只是濫竽充數。",
            "看見精彩的魔術表演，觀眾們都嘆為觀直。",
            "考試臨近，他迫不急待地想知道成績。",
            "大家應該各抒己見，切勿隨聲附合。"
          ],
          answer: 0,
          explanation: "【失分陷阱：同音別字】\nA.「濫竽充數」完全正確（竽：古代樂器）。\nB. 應作「嘆為觀止」（讚美事物好到了極點）。\nC. 應作「迫不及待」（「及」是趕得上的意思，非「急」）。\nD. 應作「隨聲附和」（「和」讀 hè，意為附和跟從）。"
        },
        {
          id: 2,
          category: "關聯詞精準搭配",
          question: "「弟弟________把零用錢全部花光買零食，________願意留下一部分作慈善捐款。」橫線上最適合填入哪一組關聯詞？",
          options: [
            "寧可……也不……",
            "與其……不如……",
            "即使……也……",
            "雖然……但是……"
          ],
          answer: 1,
          explanation: "【失分陷阱：選擇關係邏輯】\n句子在比較兩種做法的優劣並傾向後者（捐款），標準搭配為「與其……不如……」。若用「寧可……也不……」，後者應是不願做的事（例：寧可餓著，也不吃來歷不明的食物）。"
        },
        {
          id: 3,
          category: "病句辨析",
          question: "下列哪一句「沒有」語病？",
          options: [
            "通過這次全級演講比賽，使同學們的口才有了顯著進步。",
            "春天的嘉道理農場是個百花盛開的美麗季節。",
            "博物館展出了兩千多年前新出土的大量珍貴文物。",
            "無論天氣多麼惡劣，搜救人員依然堅守在搜救前線。"
          ],
          answer: 3,
          explanation: "【失分陷阱：主語殘缺與主賓不配】\nA. 介詞濫用導致主語殘缺，應刪去「通過」或「使」。\nB. 主賓搭配不當，「農場」是地方，不是「季節」。\nC. 定語語序不當，應為「新出土的兩千多年前的大量珍貴文物」。\nD. 條件關聯詞「無論……依然……」搭配正確，語意通順。"
        },
        {
          id: 4,
          category: "古詩修辭（借代）",
          question: "「烽火連三月，家書抵萬金。」詩中的「烽火」運用了哪種修辭手法，借指甚麼？",
          options: [
            "比喻，借指夜間照明的火把",
            "借代，借指戰爭或軍事戰亂",
            "擬人，借指軍隊奔馳的英姿",
            "誇張，借指春天山火蔓延"
          ],
          answer: 1,
          explanation: "【失分陷阱：比喻與借代混淆】\n比喻需要本體與喻體同時存在或有相似性；古代邊防遇敵時點燃狼煙報警，此處以「烽火」這項具體特徵直接代指「戰爭」，屬於借代修辭。"
        },
        {
          id: 5,
          category: "詞語感情色彩",
          question: "下列句子中，哪一個加引號的詞語帶有「褒義」（讚揚）色彩？",
          options: [
            "狐狸在獵人面前耍弄牠那「狡黠」的伎倆。",
            "面對窮兇極惡的歹徒，警員表現得十分「果敢」。",
            "他總是喜歡在同學面前「吹噓」自己的家境多麼富裕。",
            "這個奸商經常「處心積慮」地謀取暴利。"
          ],
          answer: 1,
          explanation: "【失分陷阱：誤解詞義感情色彩】\n「果敢」指果斷勇敢，用於讚美正義行為，為褒義詞；「狡黠」（詭詐）、「吹噓」（誇大吹牛）、「處心積慮」（千方百計謀劃壞事）均屬貶義詞。"
        },
        {
          id: 6,
          category: "標點符號規範",
          question: "下列各句中，省略號（……）使用最恰當的是：",
          options: [
            "書架上放滿了《三國演義》、《水滸傳》、《西遊記》……等古典小說。",
            "小明結結巴巴地說：「我……我真的……不知道這件事。」",
            "這座花園裡種植了玫瑰、百合、菊花……等等花卉。",
            "請你列舉出三個以上的中國傳統節日……"
          ],
          answer: 1,
          explanation: "【失分陷阱：省略號與「等」字重複】\n省略號本身已包含「等、等等」的意思，不可與「等」並列使用（A、C 錯誤）。D 選項要求明確列出三個，不應用省略號。B 選項準確表現說話斷斷續續的情態。"
        },
        {
          id: 7,
          category: "近義詞精準搭配",
          question: "選出最適當的詞語填入橫線：「天文台發出紅色暴雨警告信號，教育局宣佈全港學校上午________上課。」",
          options: [
            "中止",
            "終止",
            "停止",
            "廢除"
          ],
          answer: 2,
          explanation: "【失分陷阱：近義動詞辨析】\n「停止上課」為標準常規搭配。「中止」指中途暫時停頓；「終止」指徹底結束不再恢復；「廢除」多用於法令、制度或條約。"
        },
        {
          id: 8,
          category: "句式轉換（反問改陳述）",
          question: "將反問句「難道我們不應該為保護地球環境盡一份力嗎？」改為陳述句，最貼切原意的是：",
          options: [
            "我們應該為保護地球環境盡一份力。",
            "我們不應該為保護地球環境盡一份力。",
            "我們難道要為保護地球環境盡一份力？",
            "我們是否該為保護地球環境盡一份力呢？"
          ],
          answer: 0,
          explanation: "【失分陷阱：雙重否定轉換漏掉否定詞】\n反問句「難道不……嗎？」表達的是肯定的意思。轉換為陳述句時，需去掉反問詞「難道、嗎」以及否定詞「不」，並將問號改為句號。"
        },
        {
          id: 9,
          category: "多音多義字辨讀",
          question: "下列詞語中，加引號字的讀音與「塞」翁失馬的「塞」相同的是：",
          options: [
            "交通堵「塞」",
            "邊「塞」要壘",
            "軟木瓶「塞」",
            "閉目「塞」聽"
          ],
          answer: 1,
          explanation: "【失分陷阱：一字多音】\n「塞翁失馬」的「塞」讀 sài（邊境險要之處）。A、D 讀 sè（堵塞、閉塞）；C 讀 sāi（名詞瓶塞）。只有 B「邊塞」讀 sài。"
        },
        {
          id: 10,
          category: "言外之意與反語理解",
          question: "媽媽對沉迷電子遊戲的哥哥說：「你再這麼『勤奮』地玩下去，視力表上的符號都要認不出了。」媽媽這句話的言外之意是：",
          options: [
            "稱讚哥哥玩遊戲專注執著",
            "諷刺並警告哥哥過度玩遊戲將嚴重傷害眼睛",
            "鼓勵哥哥換更大的螢幕玩遊戲",
            "希望哥哥每天認真檢查視力"
          ],
          answer: 1,
          explanation: "【失分陷阱：字面意思與反語區分】\n「勤奮」在此處加上引號構成反語修辭，媽媽透過誇張後果（認不出視力表符號），實際上是在責備並警告其沉迷遊戲損害視力。"
        },
        {
          id: 11,
          category: "古詩文哲理理解",
          question: "「欲窮千里目，更上一層樓。」這句經典唐詩所蘊含的哲理是：",
          options: [
            "只有站得更高，才能看得更遠；引申想要取得更大成就，必須付出更多努力。",
            "高處的風景遠比低處美麗，住高樓比住平房舒適。",
            "登高望遠時一定要小心階梯，防範失足危險。",
            "千里之外的景象非常微小，必須藉助望遠鏡觀察。"

          question: "若 A × 3/5 = B ÷ 3/5（A、B 均大於 0），則 A 與 B 的大小關係是：",
          options: [
            "A > B",
            "A < B",
            "A = B",
            "無法確定"
          ],
          answer: 0,
          explanation: "【失分陷阱：未將除法轉為乘法比較】\n除以一個分數等於乘以它的倒數：B ÷ 3/5 = B × 5/3。\n已知 A × 3/5 = B × 5/3。因為 3/5 < 5/3，乘積相等時，乘數越小，被乘數越大，故 A > B。"
        },
        {
          id: 9,
          category: "含括號簡易方程",
          question: "解方程：4(y - 3) + 6 = 26，求 y 的值：",
          options: [
            "7",
            "8",
            "9",
            "6"
          ],
          answer: 1,
          explanation: "【解題步驟】\n4(y - 3) = 26 - 6\n4(y - 3) = 20\ny - 3 = 20 ÷ 4\ny - 3 = 5\ny = 8。"
        },
        {
          id: 10,
          category: "圖形拼合周界變化",
          question: "將兩個長 8 cm、闊 4 cm 的相同長方形拼成一個大正方形，拼成的大正方形周界是多少 cm？",
          options: [
            "32 cm",
            "48 cm",
            "24 cm",
            "64 cm"
          ],
          answer: 0,
          explanation: "【失分陷阱：直接把兩個長方形周界相加】\n拼合後內部有兩條 8 cm 邊重疊消失。將兩條 8 cm 的長邊並排拼合，新圖形的長是 8 cm，闊是 4 + 4 = 8 cm，成為邊長 8 cm 的正方形。\n周界 = 8 × 4 = 32 cm。"
        },
        {
          id: 11,
          category: "八個方向相對位置",
          question: "如果志明站在小麗的「西北方」，那麼小麗站在志明的甚麼方向？",
          options: [
            "東北方",
            "西南方",
            "東南方",
            "西北方"
          ],
          answer: 2,
          explanation: "【失分陷阱：只反轉其中一個方位】\n觀察點互換時，方向完全相反：「西」對「東」，「北」對「南」，因此「西北方」的相反方向是「東南方」。"
        },
        {
          id: 12,
          category: "時間單位換算與行程",
          question: "陳先生駕車以平均時速 60 公里行駛，他行駛了 45 分鐘，一共行駛了多少公里？",
          options: [
            "40 公里",
            "45 公里",
            "50 公里",
            "55 公里"
          ],
          answer: 1,
          explanation: "【失分陷阱：誤將 45 分鐘當作 0.45 小時】\n1 小時 = 60 分鐘，45 分鐘 = 45/60 小時 = 3/4 小時（0.75 小時）。\n路程 = 速率 × 時間 = 60 × 3/4 = 45 公里。"
        },
        {
          id: 13,
          category: "代數式括號運用",
          question: "小櫻有 $m，買了 5 枝每枝 $n 的原子筆後，再把餘下的錢平均分給 2 名弟弟。每名弟弟分得多少元？",
          options: [
            "$(m - 5n) ÷ 2",
            "$(m - n) ÷ 2",
            "$m - 5n ÷ 2",
            "$(5n - m) ÷ 2"
          ],
          answer: 0,
          explanation: "【失分陷阱：漏寫括號導致先除後減】\n買筆花去 $5n，餘下 $(m - 5n)。必須加上括號表示先算減法再平分：$(m - 5n) ÷ 2。"
        },
        {
          id: 14,
          category: "分數除法應用",
          question: "水桶裡有水 3又3/4 升。若將其分裝入容量為 3/8 升的玻璃樽內，最多可裝滿多少個玻璃樽？",
          options: [
            "8 個",
            "9 個",
            "10 個",
            "11 個"
          ],
          answer: 2,
          explanation: "【解題步驟】\n3又3/4 ÷ 3/8 = 15/4 ÷ 3/8\n= 15/4 × 8/3\n約分後得 5 × 2 = 10 個。"
        },
        {
          id: 15,
          category: "複合圖形割補面積",
          question: "一個直角梯形，上底 6 cm，下底 10 cm，垂直高 4 cm。在梯形內部剪去一個底 4 cm、高 3 cm 的三角形，餘下部分的面積是多少？",
          options: [
            "26 平方厘米",
            "32 平方厘米",
            "20 平方厘米",
            "18 平方厘米"
          ],
          answer: 0,
          explanation: "【解題步驟】\n梯形面積 = (6 + 10) × 4 ÷ 2 = 32 平方厘米。\n三角形面積 = 4 × 3 ÷ 2 = 6 平方厘米。\n餘下面積 = 32 - 6 = 26 平方厘米。"
        },
        {
          id: 16,
          category: "文字題列方程",
          question: "某數的 4 倍減去 18，剛好等於該數的 2 倍加上 14。求某數是多少？",
          options: [
            "15",
            "16",
            "17",
            "18"
          ],
          answer: 1,
          explanation: "【解題步驟】\n設某數為 x：\n4x - 18 = 2x + 14\n4x - 2x = 14 + 18\n2x = 32 → x = 16。"
        },
        {
          id: 17,
          category: "四邊形性質辨析",
          question: "下列關於菱形（Rhombus）的性質描述，哪一項「不一定正確」？",
          options: [
            "四條邊的長度完全相等",
            "對邊互相平行",
            "四個角都是直角 (90°)",
            "對角線互相垂直平分"
          ],
          answer: 2,
          explanation: "【失分陷阱：混淆菱形與正方形】\n菱形四邊相等、對邊平行且對角線互相垂直平分；但它的四個角不一定是直角（只有當四個角都是直角時，才特稱為正方形）。"
        },
        {
          id: 18,
          category: "平均數總分差值法",
          question: "小明前 4 次測驗的平均成績是 82 分。如果他希望 5 次測驗的平均成績達到 85 分，他在第 5 次測驗至少需要考得多少分？",
          options: [
            "95 分",
            "97 分",
            "92 分",
            "90 分"
          ],
          answer: 1,
          explanation: "【失分陷阱：直接用 85×2 - 82】\n前 4 次總分 = 82 × 4 = 328 分。\n5 次目標總分 = 85 × 5 = 425 分。\n第 5 次至少需考 = 425 - 328 = 97 分。"
        },
        {
          id: 19,
          category: "體積與容量單位換算",
          question: "一個長方體水箱內部尺寸為長 50 cm、闊 40 cm、高 30 cm。如果水箱注入了半箱水，水箱內有水多少公升 (L)？",
          options: [
            "60 公升",
            "30 公升",
            "300 公升",
            "15 公升"
          ],
          answer: 1,
          explanation: "【失分陷阱：忘記除以 2 或單位進率出錯】\n水箱總容積 = 50 × 40 × 30 = 60,000 cm³。\n半箱水體積 = 60,000 ÷ 2 = 30,000 cm³。\n因為 1,000 cm³ = 1 公升，所以 30,000 cm³ = 30 公升。"
        },
        {
          id: 20,
          category: "買幾送幾週期問題",
          question: "果汁每盒售價 $12，超級市場推出「買四送一」特惠活動。媽媽拿了 15 盒果汁，結帳時共需付款多少元？",
          options: [
            "$144",
            "$180",
            "$120",
            "$156"
          ],
          answer: 0,
          explanation: "【失分陷阱：誤算成 15 - 3 = 12 以外的組合】\n「買四送一」即每 5 盒為 1 組，每組只需付 4 盒的錢。\n15 ÷ 5 = 3 組。\n實際需付費盒數 = 3 × 4 = 12 盒。\n總金額 = 12 × $12 = $144。"
        }
      ]
    };

    const subjectOrder = ['chinese', 'english', 'maths'];
    const subjectLabels = {
      chinese: { name: '中文科', title: '小五中文科呈分模擬卷 (20題單選)', report: '小五中文科 呈分試評估報告' },
      english: { name: '英文科', title: 'Primary 5 English Pre-S1 Assessment (20 MCQs)', report: 'Primary 5 English Assessment Report' },
      maths: { name: '數學科', title: '小五數學科呈分模擬卷 (20題單選)', report: '小五數學科 呈分試評估報告' }
    };

    // 計算每日自動輪替科目（按香港時間 UTC+8 天數輪替）
    function getDailyRotatedSubject() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const hkTime = new Date(utc + (3600000 * 8));
      const dayCount = Math.floor(hkTime.getTime() / (1000 * 60 * 60 * 24));
      const dateStr = `${hkTime.getFullYear()}-${String(hkTime.getMonth() + 1).padStart(2, '0')}-${String(hkTime.getDate()).padStart(2, '0')}`;
      document.getElementById('hk-date-badge').textContent = `HKT ${dateStr}`;
      return subjectOrder[dayCount % 3];
    }

    let currentSubject = getDailyRotatedSubject();
    let currentIndex = 0;
    let userAnswers = new Array(20).fill(null);
    let flaggedQuestions = new Array(20).fill(false);
    let timerTotalSeconds = 1200; // 20 分鐘 = 1200 秒
    let timeSpentSeconds = 0;
    let timerInterval = null;
    let isPaused = false;
    let showWrongOnly = false;

    function switchSubject(subKey) {
      currentSubject = subKey;
      document.getElementById('daily-rotation-info').textContent = `當前練習科目：${subjectLabels[subKey].name}（支援中、英、數每日自動輪替或手動切換）`;
      resetCurrentExam();
    }

    function switchToNextSubject() {
      const nextIdx = (subjectOrder.indexOf(currentSubject) + 1) % subjectOrder.length;
      switchSubject(subjectOrder[nextIdx]);
    }

    function updateTabUI() {
      subjectOrder.forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if (s === currentSubject) {
          btn.className = "py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-blue-600 text-white shadow-md";
        } else {
          btn.className = "py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-[#202430]";
        }
      });
      document.getElementById('exam-heading').textContent = subjectLabels[currentSubject].title;
    }

    function renderPalette() {
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const btn = document.createElement('button');
        btn.id = `pal-${i}`;
        btn.textContent = i + 1;
        btn.className = getPaletteClass(i);
        btn.onclick = () => { if (!isPaused) loadQuestion(i); };
        grid.appendChild(btn);
      }
      updateAnsweredCount();
    }

    function getPaletteClass(i) {
      const isCur = i === currentIndex;
      const isAns = userAnswers[i] !== null;
      const isFlg = flaggedQuestions[i];
      let base = "h-9 w-full rounded-xl text-xs font-bold transition flex items-center justify-center ";

      if (isCur) return base + "bg-[#1e273c] text-blue-400 border-2 border-blue-500 shadow-md";
      if (isFlg) return base + "bg-[#2a241a] text-amber-300 border border-amber-500/80";
      if (isAns) return base + "bg-blue-600/25 text-blue-300 border border-blue-500/60";
      return base + "bg-[#161920] text-slate-400 border border-[#252b37] hover:bg-[#1f2431]";
    }

    function updateAnsweredCount() {
      const count = userAnswers.filter(a => a !== null).length;
      document.getElementById('palette-count').textContent = `${count} / 20 已答`;
    }

    function loadQuestion(idx) {
      currentIndex = idx;
      const q = examDatabase[currentSubject][idx];

      document.getElementById('item-number-tag').textContent = `第 ${idx + 1} 題 / 共 20 題`;
      document.getElementById('category-tag').textContent = `${q.category}`;
      document.getElementById('question-prompt').textContent = q.question;

      updateFlagUI();

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((optText, optIdx) => {
        const isChosen = userAnswers[currentIndex] === optIdx;
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-3.5 sm:p-4 rounded-2xl border transition flex items-center justify-between group ${
          isChosen
            ? 'bg-[#1a2438] border-blue-500 text-white shadow-lg ring-1 ring-blue-500/50'
            : 'bg-[#15181f] border-[#242834] hover:border-[#343c4d] hover:bg-[#191d26] text-slate-300'
        }`;

        btn.onclick = () => {
          if (!isPaused) {
            userAnswers[currentIndex] = optIdx;
            loadQuestion(currentIndex);
          }
        };

        btn.innerHTML = `
          <div class="flex items-center gap-3.5">
            <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold transition ${
              isChosen ? 'bg-blue-600 text-white shadow-md' : 'bg-[#202531] text-slate-400 group-hover:text-slate-200 border border-[#2c3342]'
            }">${letters[optIdx]}</span>
            <span class="text-sm sm:text-base ${isChosen ? 'text-white font-medium' : ''}">${optText}</span>
          </div>
          ${isChosen ? '<i class="fa-solid fa-circle-check text-blue-400 text-base"></i>' : ''}
        `;
        container.appendChild(btn);
      });

      document.getElementById('prev-btn').disabled = idx === 0;
      document.getElementById('next-btn').disabled = idx === 19;

      for (let i = 0; i < 20; i++) {
        const b = document.getElementById(`pal-${i}`);
        if (b) b.className = getPaletteClass(i);
      }
      updateAnsweredCount();
    }

    function navigate(delta) {
      const target = currentIndex + delta;
      if (target >= 0 && target < 20) loadQuestion(target);
    }

    function toggleFlag() {
      flaggedQuestions[currentIndex] = !flaggedQuestions[currentIndex];
      updateFlagUI();
      const b = document.getElementById(`pal-${currentIndex}`);
      if (b) b.className = getPaletteClass(currentIndex);
    }

    function updateFlagUI() {
      const isFlg = flaggedQuestions[currentIndex];
      const flagBtn = document.getElementById('flag-btn');
      const flagText = document.getElementById('flag-text');
      if (isFlg) {
        flagBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/60 transition";
        flagText.textContent = "已標記覆核";
        flagBtn.querySelector('i').className = "fa-solid fa-flag text-xs text-amber-400";
      } else {
        flagBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#191d26] hover:bg-[#222835] text-slate-300 border border-[#2a3140] transition";
        flagText.textContent = "標記覆核";
        flagBtn.querySelector('i').className = "fa-regular fa-flag text-xs";
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused) {
          if (timerTotalSeconds > 0) {
            timerTotalSeconds--;
            timeSpentSeconds++;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            alert("20 分鐘作答時間已到！系統將自動交卷並進行批改。");
            finishExam();
          }
        }
      }, 1000);
    }

    function renderTimer() {
      const m = Math.floor(timerTotalSeconds / 60);
      const s = timerTotalSeconds % 60;
      const elem = document.getElementById('timer-text');
      elem.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      if (timerTotalSeconds <= 180) {
        elem.classList.add('text-rose-400');
      } else {
        elem.classList.remove('text-rose-400');
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      const overlay = document.getElementById('pause-overlay');
      const txt = document.getElementById('pause-text');
      if (isPaused) {
        txt.textContent = "繼續";
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      } else {
        txt.textContent = "暫停";
        overlay.classList.remove('flex');
        overlay.classList.add('hidden');
      }
    }

    function confirmSubmit() {
      const unans = userAnswers.filter(a => a === null).length;
      const msg = unans > 0
        ? `你尚有 ${unans} 題未作答！確定現在交卷嗎？`
        : "所有題目已完成作答，確定現在交卷並查看詳細分析嗎？";
      if (window.confirm(msg)) finishExam();
    }

    function finishExam() {
      clearInterval(timerInterval);
      document.getElementById('exam-card').classList.add('hidden');
      document.getElementById('result-view').classList.remove('hidden');
      document.getElementById('result-view').classList.add('flex');

      const qList = examDatabase[currentSubject];
      let score = 0;
      qList.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) score++;
      });

      const accuracy = Math.round((score / 20) * 100);
      const m = Math.floor(timeSpentSeconds / 60);
      const s = timeSpentSeconds % 60;

      document.getElementById('res-subject-label').textContent = subjectLabels[currentSubject].report;
      document.getElementById('res-score').textContent = `${score} / 20`;
      document.getElementById('res-accuracy').textContent = `${accuracy}%`;
      document.getElementById('res-time').textContent = `${m}分 ${s}秒`;

      let bandText = '需加強鞏固';
      let bandColor = 'text-rose-400';
      if (score >= 18) {
        bandText = 'Band 1A (優異)';
        bandColor = 'text-emerald-400';
      } else if (score >= 15) {
        bandText = 'Band 1 (良好)';
        bandColor = 'text-blue-400';
      } else if (score >= 12) {
        bandText = 'Band 2 (尚可)';
        bandColor = 'text-amber-400';
      }

      const bandElem = document.getElementById('res-band');
      bandElem.textContent = bandText;
      bandElem.className = `text-2xl font-black mt-1 ${bandColor}`;

      showWrongOnly = false;
      document.getElementById('filter-wrong-btn').textContent = "只看錯題 (Show Mistakes Only)";
      renderReviewCards();
    }

    function toggleWrongOnly() {
      showWrongOnly = !showWrongOnly;
      document.getElementById('filter-wrong-btn').textContent = showWrongOnly
        ? "顯示全部 20 題 (Show All)"
        : "只看錯題 (Show Mistakes Only)";
      renderReviewCards();
    }

    function renderReviewCards() {
      const container = document.getElementById('review-cards-list');
      container.innerHTML = '';
      const qList = examDatabase[currentSubject];
      const letters = ['A', 'B', 'C', 'D'];
      let renderedCount = 0;

      qList.forEach((q, i) => {
        const userChoice = userAnswers[i];
        const isCorrect = userChoice === q.answer;
        if (showWrongOnly && isCorrect) return;
        renderedCount++;

        const card = document.createElement('div');
        card.className = `p-4 sm:p-5 rounded-2xl border transition ${
          isCorrect ? 'bg-[#121a16] border-emerald-500/30' : 'bg-[#1f1316] border-rose-500/30'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2 flex-wrap">
            <span class="font-bold text-white text-sm sm:text-base">第 ${i + 1} 題（${q.category}）：<br><span class="font-normal text-slate-200 mt-1 inline-block whitespace-pre-line">${q.question}</span></span>
            <span class="px-2.5 py-0.5 rounded-md text-xs font-bold shrink-0 ${
              isCorrect ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-300 border border-rose-500/40'
            }">
              ${isCorrect ? '答對 Correct' : '答錯 Incorrect'}
            </span>
          </div>
          <div class="text-xs sm:text-sm text-slate-300 grid grid-cols-1 sm:grid-cols-2 gap-2 my-3">
            <div class="bg-[#171920] p-2.5 rounded-xl border border-[#252834]">
              你的選擇：<strong class="${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${userChoice !== null ? letters[userChoice] + '. ' + q.options[userChoice] : '未作答'}</strong>
            </div>
            <div class="bg-[#171920] p-2.5 rounded-xl border border-[#252834]">
              正確答案：<strong class="text-emerald-400">${letters[q.answer]}. ${q.options[q.answer]}</strong>
            </div>
          </div>
          <div class="mt-2 text-xs sm:text-sm bg-[#151821] p-3.5 rounded-xl border border-[#242937] text-slate-300 leading-relaxed whitespace-pre-line">
            <strong class="text-blue-400 font-semibold block mb-1">詳細解題思路與呈分試避坑分析：</strong>${q.explanation}
          </div>
        `;
        container.appendChild(card);
      });

      if (renderedCount === 0 && showWrongOnly) {
        container.innerHTML = `<div class="text-center py-8 text-emerald-400 font-bold">太棒了！本科 20 題全部答對，沒有任何錯題！</div>`;
      }
    }

    function resetCurrentExam() {
      userAnswers.fill(null);
      flaggedQuestions.fill(false);
      timerTotalSeconds = 1200;
      timeSpentSeconds = 0;
      isPaused = false;

      document.getElementById('result-view').classList.remove('flex');
      document.getElementById('result-view').classList.add('hidden');
      document.getElementById('exam-card').classList.remove('hidden');

      updateTabUI();
      loadQuestion(0);
      renderPalette();
      renderTimer();
      startTimer();
    }

    window.onload = () => {
      document.getElementById('daily-rotation-info').textContent = `今日預設輪替科目：${subjectLabels[currentSubject].name}（支援每日自動輪替或手動切換）`;
      updateTabUI();
      renderPalette();
      loadQuestion(0);
      startTimer();
    };
  </script>
</body>
</html>
